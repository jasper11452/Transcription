[project]
name = "transcript-domain"
version = "0.1.0"
description = "transcript 重建版 · domain：领域模型与错误分类法（零 I/O、零第三方依赖）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 硬约束：本包是全仓唯一的零第三方依赖包（见 REIMAGINED_ARCHITECTURE.md §2 与
# tests/test_zero_dependency_contract.py）。这里出现任何依赖都会让架构断言变假。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/transcript_reimagined/` 是 PEP 420 命名空间包：重建版的每个模块包
# （domain / config / post / ingest / …，由各自的脚手架贡献）都是它的子包。
# 这里只打包本服务，不是整个重建版。
#
# 为什么是 `transcript_reimagined` 而不是 `transcript`：遗留系统仍以 `transcript`
# 安装在本仓的 .venv 里（site-packages 的 `transcript` + 根 `pyproject.toml`），
# 同名会让 `import transcript.domain` 解析到遗留包。重建版用一个独占的顶层名，
# 与遗留版并存且互不干扰。
packages = ["src/transcript_reimagined/domain"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
