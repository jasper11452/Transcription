[project]
name = "transcript-reimagined"
version = "0.1.0"
description = "transcript 重建版 —— 模块化单体（Phase 1 领域内核试点）"
requires-python = ">=3.12,<3.13"
# 根项目本身不发布任何代码：它只做两件事 —— 声明 workspace 成员，
# 以及给「一次跑全部」提供统一的 pytest / ruff / import-linter 配置。
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─────────────────────────────────────────────────────────────────────────────
# 四个成员包共享一个命名空间 `transcript_reimagined`（PEP 420 隐式命名空间包，
# 各成员的 `src/transcript_reimagined/` 下都没有 `__init__.py`）。
#
# workspace 解决的是「被结构逼出来的复制」：没有它，`runner` 无法 import
# `domain`/`ingest`/`post`（它们只是普通目录，没有可依赖的已安装包），于是
# 脚手架阶段 runner 把三个包各拷了一份（736 行）。那不只是重复 —— 同一个进
# 程里同名模块被导入两次会产生两个类对象，跨包 isinstance 静默失效。
#
# 顶层名为什么是 `transcript_reimagined` 而不是 `transcript`：遗留系统仍以
# `transcript` 安装在产品仓库的 .venv 里，同名会让 `import transcript.domain`
# 解析到遗留包 —— 静默跑旧代码而不报错。
# ─────────────────────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["domain", "ingest", "post", "runner"]

# 根项目是虚拟项目：没有可发布的代码，只有成员包与共享配置。
# 不加这一行，`uv sync` 会尝试用 hatchling 构建根项目并因「找不到要打包的目录」失败。
[tool.uv]
package = false

[tool.uv.sources]
transcript-domain = { workspace = true }
transcript-ingest = { workspace = true }
transcript-post = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # 架构 §3：把「无环性」从口号变成可检查事实。
    "import-linter>=2.0",
]

# ── 一次跑全部：testpaths 覆盖四个成员；各成员 src 的路径注入在
#    conftest_support/paths.py（不用 ini 的 pythonpath：它相对 rootdir 解析，
#    会被成员自带的 pytest 配置抢走 rootdir 而静默失效）──
[tool.pytest.ini_options]
testpaths = ["domain/tests", "ingest/tests", "post/tests", "runner/tests"]
# 只服务一件事：让根 conftest.py 能 import conftest_support（路径相对 rootdir）。
# 成员 src 的注入仍在 conftest_support/paths.py —— 那是为了不依赖 rootdir 判定。
# 有了这一行，`uv run pytest`（console script，不把 cwd 放进 sys.path）也能跑。
pythonpath = ["."]
addopts = "--import-mode=importlib -q"
markers = [
    "rule(id): 绑定行为契约规则 ID 的验收测试（如 RULE-025、RULE-059）",
    "pending_implementation(rule_id): 规则尚未实现，预期失败/跳过，必须带规则 ID",
    "phase3: align / merge —— Phase 3 才落地（本阶段是显式 NotImplementedError 占位）",
    "deferred: 规则卡已确认但实现属后续阶段",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["domain/src", "ingest/src", "post/src", "runner/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ─────────────────────────────────────────────────────────────────────────────
# 分层契约（架构 §3）。这里声明的是**跨成员**的那几条；成员内部的单向依赖由各
# 成员自己的 pyproject 声明。合起来才是完整的无环证明。
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = [
    "transcript_reimagined",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "分层：runner -> {ingest, post} -> domain"
type = "layers"
layers = [
    "transcript_reimagined.runner",
    "transcript_reimagined.post | transcript_reimagined.ingest",
    "transcript_reimagined.domain",
]

[[tool.importlinter.contracts]]
name = "domain 是全仓唯一的叶：不依赖任何上层包"
type = "forbidden"
source_modules = ["transcript_reimagined.domain"]
forbidden_modules = [
    "transcript_reimagined.ingest",
    "transcript_reimagined.post",
    "transcript_reimagined.runner",
]

[[tool.importlinter.contracts]]
name = "重建版绝不包装 legacy 实现（重建，而非改名）"
type = "forbidden"
source_modules = ["transcript_reimagined"]
forbidden_modules = ["transcript"]