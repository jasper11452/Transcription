[project]
name = "transcript-summarize"
version = "0.1.0"
description = "transcript 重建版 · summarize：显式开启的 Agent 总结 + 流式"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "transcript-config",
    "transcript-domain",
    "transcript-post",
    "transcript-state",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_reimagined/summarize"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
transcript-config = { workspace = true }
transcript-domain = { workspace = true }
transcript-post = { workspace = true }
transcript-state = { workspace = true }
