[project]
name = "transcript-web"
version = "0.1.0"
description = "transcript 重建版 · web：按资源切分的 FastAPI 路由 + SSE + 来源校验"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.28",
    "transcript-config",
    "transcript-domain",
    "transcript-engines",
    "transcript-ingest",
    "transcript-orchestrate",
    "transcript-post",
    "transcript-state",
    "transcript-summarize",
]

[project.scripts]
transcript = "transcript_reimagined.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_reimagined"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 依赖注入就是靠 Depends/File(...) 这类默认值
"src/transcript_reimagined/web/routes/*.py" = ["B008"]

[tool.uv.sources]
transcript-config = { workspace = true }
transcript-domain = { workspace = true }
transcript-engines = { workspace = true }
transcript-ingest = { workspace = true }
transcript-orchestrate = { workspace = true }
transcript-post = { workspace = true }
transcript-state = { workspace = true }
transcript-summarize = { workspace = true }
