[project]
name = "transcript-ingest"
version = "0.1.0"
description = "transcript 重建版 · ingest：探测 · 归一化 · 切片规划 · VAD（Phase 1 只含 chunking）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 本服务自己的第三方依赖是空的：切片规划是纯函数，只碰 stdlib。
# `chunking.py` 依赖 `domain` 的 `Chunk` —— 那是**同仓**包（PEP 420 命名空间
# 下的兄弟模块），不是第三方依赖，所以不写进 dependencies。
#
# Phase 3 本包要加 `audio.py` / `vad.py` 时会引入 `numpy` + `mlx-audio`（VAD 模型）
# 与 ffmpeg 子进程。届时再加，且**只加在本包** —— 架构要求 `ingest` 是唯一碰
# ffmpeg 的地方（REIMAGINED_ARCHITECTURE.md §2）。

dependencies = [
    "transcript-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/transcript_reimagined/` 是 PEP 420 命名空间包：重建版的每个模块包
# （domain / config / post / ingest / …，由各自的脚手架贡献）都是它的子包。
# 这里只打包本服务，不是整个重建版。
#
# 顶层名为什么是 `transcript_reimagined` 而不是 `transcript`：遗留系统仍以
# `transcript` 安装在本仓 .venv 里，同名会让 `import transcript.chunking` 解析到
# 遗留包 —— 那正是本服务最该避免的混淆（等价性对比要么显式引 legacy 路径，
# 要么根本不引，见 tests/test_equivalence_legacy_chunking.py 的说明）。
packages = ["src/transcript_reimagined/ingest"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
transcript-domain = { workspace = true }
