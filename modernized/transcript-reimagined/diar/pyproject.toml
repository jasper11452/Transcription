[project]
name = "transcript-diar"
version = "0.1.0"
description = "transcript 重建版 · diar：说话人分离（ctypes FFI，仅离线路径）"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<2.5",
    "soundfile>=0.13",
    "transcript-config",
    "transcript-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_reimagined/diar"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
transcript-config = { workspace = true }
transcript-domain = { workspace = true }
