[project]
name = "transcript-engines"
version = "0.1.0"
description = "transcript 重建版 · engines：Engine 协议 + SPECS 注册表 + 4 个适配器"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "mlx-audio>=0.4.3",
    "mlx-whisper>=0.4.3",
    "transcript-config",
    "transcript-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_reimagined/engines"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.uv.sources]
transcript-config = { workspace = true }
transcript-domain = { workspace = true }
