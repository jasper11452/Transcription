[project]
name = "transcript-runner"
version = "0.1.0"
description = "transcript 重建 · Phase 1 纵向切片入口：音频元数据 JSON → 分片规划 → 词表替换 → 渲染 → 真实落盘"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# 零运行时依赖：本切片只用标准库。真实 I/O 由 file I/O 与跨包 import 提供，
# 而不是由第三方库提供 —— 这是试点要验证的接缝。

[project.scripts]
transcript-run = "transcript_reimagined.runner.cli:main"

dependencies = [
    "transcript-domain",
    "transcript-ingest",
    "transcript-post",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_reimagined"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # 架构 §3 引入的 dev 依赖：把「无环性」从口号变成可检查事实
    "import-linter>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]


[tool.importlinter]
root_packages = ["transcript_reimagined"]

[[tool.importlinter.contracts]]
name = "layers: runner -> {ingest, post} -> domain"
type = "layers"
layers = [
    "transcript_reimagined.runner",
    "transcript_reimagined.post | transcript_reimagined.ingest",
    "transcript_reimagined.domain",
]

[[tool.importlinter.contracts]]
name = "domain 不依赖任何上层包"
type = "forbidden"
source_modules = ["transcript_reimagined.domain"]
forbidden_modules = [
    "transcript_reimagined.ingest",
    "transcript_reimagined.post",
    "transcript_reimagined.runner",
]

[tool.uv.sources]
transcript-domain = { workspace = true }
transcript-ingest = { workspace = true }
transcript-post = { workspace = true }
