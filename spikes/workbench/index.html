<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>转录工作台 · 本地</title>
<meta name="description" content="本机音频转录的校对工作台：波形导航、分段校对、多格式导出。纯前端，无上传。" />
<link rel="stylesheet" href="./styles/tokens.css" />
<link rel="stylesheet" href="./styles/app.css" />
</head>
<body class="app">

<a class="skip-link" href="#seg-list">跳到转录列表</a>

<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 16 16"><use href="#i-wave"/></svg>
    <div class="brand-text">
      <strong>转录工作台</strong>
      <span class="brand-sub" id="doc-source">本机 · 无上传</span>
    </div>
  </div>

  <div class="topbar-center">
    <label>
      <span class="visually-hidden">转录标题</span>
      <input id="doc-title" class="doc-title" type="text" value="未命名转录" spellcheck="false" />
    </label>
    <span class="save-state" id="save-state" title="编辑会自动保存在这台机器上">未保存</span>
  </div>

  <div class="topbar-actions">
    <button class="btn ghost" id="btn-open" title="打开音频或字幕文件（⌘O）">
      <svg viewBox="0 0 16 16"><use href="#i-doc"/></svg><span>打开</span>
    </button>
    <button class="btn ghost" id="btn-demo" title="不用准备素材，载入一段合成音频">
      <svg viewBox="0 0 16 16"><use href="#i-wave"/></svg><span>演示音频</span>
    </button>
    <button class="btn ghost icon-only" id="btn-undo" data-action="undo" title="撤销（⌘Z）" aria-label="撤销" disabled>
      <svg viewBox="0 0 16 16"><use href="#i-undo"/></svg>
    </button>
    <button class="btn ghost icon-only" id="btn-redo" data-action="redo" title="重做（⇧⌘Z）" aria-label="重做" disabled>
      <svg viewBox="0 0 16 16"><use href="#i-redo"/></svg>
    </button>
    <button class="btn primary" id="btn-export" data-action="export" title="导出（⌘E）">
      <svg viewBox="0 0 16 16"><use href="#i-export"/></svg><span>导出</span>
    </button>
    <button class="btn ghost icon-only" id="btn-palette" title="命令面板（⌘K）" aria-label="命令面板">
      <svg viewBox="0 0 16 16"><use href="#i-cmd"/></svg>
    </button>
    <button class="btn ghost icon-only" id="btn-help" data-action="help" title="快捷键（?）" aria-label="快捷键说明">
      <svg viewBox="0 0 16 16"><use href="#i-help"/></svg>
    </button>
    <button class="btn ghost icon-only" id="btn-theme" data-action="toggle-theme" title="切换主题" aria-label="切换主题">◐</button>
  </div>
</header>

<div class="dropzone-hint" id="drop-hint" aria-hidden="true"><span>松手即载入音频或字幕文件</span></div>

<main class="workspace">
  <section class="pane pane-wave" aria-label="音频波形">
    <div class="pane-head">
      <div class="pane-title">
        <svg viewBox="0 0 16 16"><use href="#i-wave"/></svg>
        <span class="pane-label">波形</span>
        <span class="chip" id="audio-info">未载入</span>
      </div>
      <div class="pane-tools">
        <div class="segmented" role="group" aria-label="波形着色方式">
          <button class="seg-btn is-active" data-mode="speaker" title="按说话人着色">说话人</button>
          <button class="seg-btn" data-mode="plain" title="单一颜色">单色</button>
        </div>
        <button class="btn tiny ghost" id="btn-zoom-out" title="缩小（－）">－</button>
        <button class="btn tiny ghost" id="btn-zoom-in" title="放大（＋）">＋</button>
        <button class="btn tiny ghost" id="btn-fit" data-action="fit" title="缩放到整体（0）">适配</button>
      </div>
    </div>
    <div class="wave-wrap" id="wave-wrap"></div>
    <div class="player">
      <button class="play-btn" id="btn-play" data-action="toggle-play" aria-label="播放 / 暂停" title="播放 / 暂停（空格）">
        <svg viewBox="0 0 16 16" id="play-icon"><use href="#i-play"/></svg>
      </button>
      <div class="player-time">
        <span id="time-current">00:00</span>
        <span class="player-time-sep">/</span>
        <span id="time-total">00:00</span>
      </div>
      <div class="player-controls">
        <label class="ctl">
          <span class="ctl-label">速度</span>
          <select id="rate-select" class="select" aria-label="播放速度">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label class="ctl range">
          <span class="ctl-label">音量</span>
          <input type="range" id="volume" min="0" max="1" step="0.02" value="0.9" aria-label="音量" />
        </label>
        <button class="btn tiny ghost" id="btn-loop" data-action="toggle-loop-segment" title="循环当前段或选区（L）" aria-pressed="false">
          <svg viewBox="0 0 16 16"><use href="#i-loop"/></svg><span>循环</span>
        </button>
        <button class="btn tiny ghost" id="btn-prev" data-action="prev-segment" title="上一段（,）" aria-label="上一段">
          <svg viewBox="0 0 16 16"><use href="#i-back"/></svg>
        </button>
        <button class="btn tiny ghost" id="btn-next" data-action="next-segment" title="下一段（.）" aria-label="下一段">
          <svg viewBox="0 0 16 16"><use href="#i-fwd"/></svg>
        </button>
        <details class="more-menu">
          <summary class="btn tiny ghost" title="更多播放选项">更多 ▾</summary>
          <div class="more-pop">
            <button class="more-item" id="btn-skip-silence" data-action="toggle-skip-silence">跳过静音 开/关</button>
            <button class="more-item" id="btn-jump" data-action="jump-time">跳到时间点…</button>
            <button class="more-item" id="btn-replay" data-action="replay-current">重放当前段</button>
          </div>
        </details>
      </div>
      <div class="player-region" id="region-info" hidden>
        <span class="region-label">选区</span>
        <span id="region-text">—</span>
        <button class="btn tiny" id="btn-region-seg" data-action="build-segment-from-region" title="用选区建分段（B）">建分段</button>
        <button class="btn tiny ghost" id="btn-region-loop" data-action="loop-region" title="循环播放选区">循环选区</button>
        <button class="btn tiny ghost" id="btn-region-clear" data-action="clear-selection" aria-label="清除选区">清除</button>
      </div>
    </div>
  </section>

  <section class="pane pane-text" aria-label="转录文本">
    <div class="pane-head">
      <div class="pane-title">
        <svg viewBox="0 0 16 16"><use href="#i-doc"/></svg>
        <span class="pane-label">转录</span>
        <span class="chip" id="seg-count">0 段</span>
      </div>
      <div class="pane-tools">
        <label class="search-field">
          <svg viewBox="0 0 16 16"><use href="#i-search"/></svg>
          <input type="search" id="search" placeholder="搜索文本（⌘F）" autocomplete="off" />
          <span class="search-hits" id="search-hits"></span>
        </label>
        <button class="btn tiny ghost" id="btn-filter-low" data-filter="low" title="只显示低置信度分段">低置信</button>
        <details class="more-menu" id="filter-menu">
          <summary class="btn tiny ghost" title="更多筛选">更多 ▾</summary>
          <div class="more-pop">
            <button class="more-item" data-filter="flag">只显示待复核</button>
            <button class="more-item" data-filter="edited">只显示已手动改过</button>
            <button class="more-item" id="btn-filter-speaker">只显示当前说话人</button>
            <button class="more-item" id="btn-filter-clear" data-filter="__clear">清除全部筛选</button>
          </div>
        </details>
      </div>
    </div>
    <div class="sel-toolbar" id="sel-toolbar" hidden>
      <span id="sel-count">已选 0 段</span>
      <button class="btn tiny ghost" data-bulk="merge">合并</button>
      <button class="btn tiny ghost" data-bulk="delete">删除</button>
      <button class="btn tiny ghost" data-bulk="flag">标为待复核</button>
      <button class="btn tiny ghost" data-bulk="copy">复制文本</button>
      <select class="select tiny" id="bulk-speaker" aria-label="把选中段设为说话人"></select>
      <button class="btn tiny ghost" id="sel-clear">取消选择</button>
    </div>
    <div class="seg-scroll" id="seg-scroll">
      <div class="seg-list" id="seg-list" role="list" tabindex="0" aria-label="转录分段列表"></div>
    </div>
    <div class="pane-foot">
      <span id="foot-hint">空格播放 · ↑↓ 选段 · E 编辑 · S 拆分 · M 合并 · ⌘K 命令</span>
      <span id="foot-words"></span>
    </div>
  </section>

  <aside class="pane pane-side" aria-label="统计与设置">
    <div class="side-scroll">
      <section class="card">
        <h2>概览</h2>
        <dl class="stat-grid" id="stat-grid"></dl>
        <div id="stat-bars" class="speaker-bars"></div>
        <div class="stack">
          <label class="switch"><input type="checkbox" id="set-autoscroll" checked /><span>播放时自动滚动</span></label>
          <label class="switch"><input type="checkbox" id="set-motion" /><span>减少动画</span></label>
          <label class="ctl range"><span class="ctl-label">字号</span><input type="range" id="set-font" min="0.85" max="1.4" step="0.05" value="1" aria-label="转录字号" /></label>
        </div>
      </section>

      <section class="card">
        <h2>说话人</h2>
        <ul class="speaker-list" id="speaker-list"></ul>
        <button class="btn tiny ghost" id="btn-add-speaker">＋ 新增说话人</button>
      </section>

      <section class="card">
        <h2>整理</h2>
        <div class="stack">
          <button class="btn tiny ghost" data-bulkop="merge-short">合并过短分段</button>
          <button class="btn tiny ghost" data-bulkop="normalize">规整时间轴（消除重叠）</button>
          <button class="btn tiny ghost" data-bulkop="replace">查找替换…</button>
          <button class="btn tiny ghost" data-bulkop="hotwords">热词表替换专名…</button>
          <button class="btn tiny ghost" data-bulkop="parse-srt">导入字幕（.srt）…</button>
        </div>
      </section>

      <section class="card">
        <h2>数据与日志</h2>
        <p class="side-note">失败与警告都落在这里，不吞错。</p>
        <ul class="log-list" id="log-list"></ul>
        <div class="row">
          <button class="btn tiny ghost" id="btn-clear-log">清空日志</button>
          <button class="btn tiny ghost" id="btn-copy-json" data-action="copy-json">复制 raw.json</button>
          <button class="btn tiny ghost" id="btn-copy-txt" data-action="copy-txt">复制纯文本</button>
        </div>
        <div class="row">
          <button class="btn tiny ghost" id="btn-clear-all" title="清空转录并重置本地存档">清空全部</button>
        </div>
      </section>
    </div>
  </aside>
</main>

<footer class="statusbar">
  <span class="status-item" id="status-audio">音频：未载入</span>
  <span class="status-item" id="status-view">视图：—</span>
  <span class="status-item" id="status-sel">选区：无</span>
  <span class="status-item" id="status-loop" hidden></span>
  <span class="status-item" id="status-playhead">播放头：00:00</span>
  <span class="status-spacer"></span>
  <span class="status-item" id="status-history">无可撤销</span>
  <span class="status-item" id="status-store">本地存档：正常</span>
</footer>

<input type="file" id="file-input" accept="audio/*,video/*,.srt,.vtt,.txt,.json" hidden multiple />
<script type="module" src="./src/main.js"></script>
</body>
</html>
